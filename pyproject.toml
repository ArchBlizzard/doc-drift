[project]
name = "docdrift"
version = "0.1.0"
description = "Dataset-audit agent that verifies data-card claims by writing, mutation-testing, and executing its own checks"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "numpy>=1.26",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
